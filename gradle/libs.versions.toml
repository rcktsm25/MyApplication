[versions]
agp = "9.3.2"
kotlin = "2.1.0"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.8.0"
constraintlayout = "2.1.4"
media3 = "1.4.1"
gson = "2.10.1"
# Librerías profesionales para UI/UX
lottie = "6.1.0"
coil = "2.5.0"
shimmer = "0.5.0"

[libraries]
androidx-browser = { group = "androidx.browser", name = "browser", version = "1.5.0" }
spotify-auth = { group = "com.spotify.android", name = "auth", version = "2.1.2" }
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# ═══════════════════════════════════════════════════════════════
# Librerías profesionales para UI/UX de nivel comercial
# ═══════════════════════════════════════════════════════════════

# Lottie - Animaciones profesionales (After Effects → Android)
# Permite animaciones vectoriales complejas sin archivos XML enormes
lottie = { group = "com.airbnb.android", name = "lottie", version.ref = "lottie" }

# Coil - Carga de imágenes profesional (alternativa moderna a Glide)
# - Carga asíncrona de imágenes desde URLs
# - Caché automática en memoria y disco
# - Placeholders y transiciones suaves
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }

# Shimmer - Efecto de carga elegante (como Facebook/Instagram)
# Muestra un efecto de "brillo" mientras carga el contenido
shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

